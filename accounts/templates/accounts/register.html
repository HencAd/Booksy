{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}

{% block title %}Rejestracja{% endblock %}

{% block content %}
<section class="p-5 tm-container-outer tm-bg-gray">
    <div class="container">
        <div class="row">
            <div class="col-md-7 mx-auto">
                <div class="tm-content-box p-4 bg-white">

                    <h2 class="text-uppercase mb-4 text-center">Rejestracja</h2>

                    <form method="POST">
                        {% csrf_token %}

                        {{ form|crispy }}

                        <button class="btn btn-primary tm-btn mt-3" type="submit">
                            Zarejestruj się
                        </button>
                    </form>

                    <div class="border-top pt-3 mt-4">
                        <small class="text-muted">
                            Masz już konto?
                            <a class="ml-2" href="{% url 'login' %}">
                                Zaloguj się
                            </a>
                        </small>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}

{% block extra_js %}
<script src="{% static 'accounts/main.js' %}"></script>
{% endblock %}

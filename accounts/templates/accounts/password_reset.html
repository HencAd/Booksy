{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Reset hasła{% endblock %}

{% block content %}
<section class="p-5 tm-container-outer tm-bg-gray">
    <div class="container">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="tm-content-box p-4 bg-white">

                    <h2 class="text-uppercase mb-4 text-center">Reset hasła</h2>

                    <p class="text-muted mb-4">
                        Podaj adres e-mail przypisany do konta. Wyślemy link do resetu hasła.
                    </p>

                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <button type="submit" class="btn btn-primary tm-btn mt-3">
                            Wyślij link resetujący
                        </button>
                    </form>

                    <div class="border-top pt-3 mt-4">
                        <small class="text-muted">
                            Pamiętasz hasło?
                            <a class="ml-2" href="{% url 'login' %}">
                                Wróć do logowania
                            </a>
                        </small>
                    </div>

                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
